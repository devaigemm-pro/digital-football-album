name: CI

# Pipeline de CI del backend del Álbum de Fútbol Digital.
#
# El DESPLIEGUE lo gestionan las integraciones nativas con Git:
#   - Supabase (integración GitHub): aplica las migraciones de supabase/migrations
#     al proyecto hosted en cada push a main.
#   - Render (auto-deploy): construye la imagen desde el Dockerfile y libera el
#     backend en cada push a main.
# Por eso este pipeline NO despliega: solo valida calidad para proteger main.
#
# - quality:      typecheck, lint, format y tests unitarios (sin base de datos).
# - integration:  levanta Supabase local, aplica migraciones y corre los tests
#                 de integración/e2e contra el stack real.
# - docker-build: valida que la imagen productiva compila (sin publicarla).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones previas del mismo ref para ahorrar recursos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (typecheck, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Tests unitarios
        # Sin variables de Supabase: los tests de integración/e2e se auto-saltan.
        run: npm test

  integration:
    name: Integración (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Iniciar Supabase local (aplica migraciones + seed)
        run: supabase start
      - name: Exportar credenciales del stack local
        run: |
          echo "SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d'\"' -f2)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'\"' -f2)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d'\"' -f2)" >> "$GITHUB_ENV"
      - name: Tests de integración y e2e
        run: npm test
      - name: Detener Supabase
        if: always()
        run: supabase stop || true

  docker-build:
    name: Validar build de la imagen
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen (sin publicar; Render la construye en el deploy)
        run: docker build -t album-backend:ci .
